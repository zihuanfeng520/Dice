<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>絨布賭桌 · 3D 擬真骰子</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#060202;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:Georgia,"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;color:#f1dfae}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
  .gold{background:linear-gradient(180deg,#fff3c4,#d9ae55 55%,#a67a2c);-webkit-background-clip:text;background-clip:text;color:transparent}
  #top{position:fixed;left:0;right:0;top:0;z-index:5;text-align:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
  #top .card{display:inline-block;min-width:170px;padding:8px 22px 10px;border-radius:16px;
    background:linear-gradient(180deg,rgba(20,8,6,.72),rgba(8,3,2,.72));border:1px solid rgba(217,174,85,.55);
    box-shadow:0 6px 24px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,235,170,.08);backdrop-filter:blur(6px)}
  #faces{font-size:34px;line-height:1.15;letter-spacing:6px;color:#fff3c9;text-shadow:0 2px 6px #000}
  #sum{font-size:20px;font-weight:700;letter-spacing:2px}
  #tag{font-size:14px;letter-spacing:4px;color:#ff9c8a;min-height:18px}
  #bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);
    display:flex;flex-direction:column;align-items:center;gap:10px}
  .row{display:flex;gap:10px;align-items:center;justify-content:center}
  button{font-family:inherit;color:#f6e4b0;cursor:pointer;border:1px solid rgba(217,174,85,.7);
    background:linear-gradient(180deg,rgba(60,24,18,.92),rgba(24,8,6,.94));border-radius:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,235,170,.18);transition:transform .08s,filter .15s}
  button:active{transform:scale(.95)}
  .cnt{width:56px;height:56px;font-size:24px;font-weight:700}
  .cnt.on{background:linear-gradient(180deg,#f3d27a,#b98a35);color:#2a0d08;border-color:#fff0b8;
    box-shadow:0 0 18px rgba(255,205,100,.55),inset 0 1px 0 rgba(255,255,255,.5)}
  #roll{height:58px;padding:0 38px;font-size:22px;font-weight:700;letter-spacing:6px;
    background:linear-gradient(180deg,#c0262d,#7d0f17);border-color:#ffd98a;color:#fff3cf;
    box-shadow:0 6px 20px rgba(160,20,30,.55),inset 0 1px 0 rgba(255,255,255,.35)}
  #music,#calib{height:40px;padding:0 14px;font-size:14px;letter-spacing:2px}
  #music.off{opacity:.55}
  #status{font-size:12px;letter-spacing:1px;color:rgba(241,223,174,.7);text-align:center;text-shadow:0 1px 3px #000}
  #start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at center,#1d0b08 0%,#060202 75%);text-align:center;padding:24px}
  #start h1{margin:0;font-size:44px;letter-spacing:10px;font-weight:700}
  #start p{margin:0;font-size:14px;letter-spacing:3px;color:rgba(241,223,174,.75);line-height:1.8}
  #enter{height:60px;padding:0 44px;font-size:22px;font-weight:700;letter-spacing:8px;
    background:linear-gradient(180deg,#f3d27a,#b98a35);color:#2a0d08;border-color:#fff0b8;
    box-shadow:0 0 30px rgba(255,205,100,.45),inset 0 1px 0 rgba(255,255,255,.5)}
  #startMsg{color:#ff9c8a}
  @media (orientation:landscape) and (max-height:520px){
    #faces{font-size:26px}#sum{font-size:16px}
    #bottom{flex-direction:row;justify-content:center;gap:14px;padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
    #status{display:none}
    .cnt{width:46px;height:46px;font-size:20px}#roll{height:48px;font-size:18px;padding:0 26px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>

<div id="top"><div class="card">
  <div id="faces">—</div>
  <div id="sum" class="gold">請搖晃手機</div>
  <div id="tag"></div>
</div></div>

<div id="bottom">
  <div class="row">
    <button class="cnt on" data-n="1">1</button>
    <button class="cnt" data-n="2">2</button>
    <button class="cnt" data-n="3">3</button>
    <button id="music">♪ 音樂</button>
    <button id="calib">⟲ 校準</button>
  </div>
  <button id="roll">擲 骰</button>
  <div id="status"></div>
</div>

<div id="start">
  <h1 class="gold">絨布賭桌</h1>
  <p>3D 擬真物理骰子<br>選 1～3 顆 · 搖晃手機擲骰 · 傾斜手機桌面跟著動</p>
  <button id="enter">進入賭桌</button>
  <p style="font-size:12px;opacity:.7">將啟用音樂與搖晃感應<br>(iPhone 會詢問動作感應權限)</p>
  <p id="startMsg"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'||typeof CANNON==='undefined'){
  $('startMsg').textContent='無法載入 3D 引擎,請確認網路後重新整理。';
  $('enter').style.display='none';
  return;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const SIZE=1.5;              // 骰子邊長
const RADIUS=0.16;           // 圓角
const GRAV=55;

/* ================= Renderer / Scene ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
$('stage').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x060202);
const camera=new THREE.PerspectiveCamera(40,1,0.1,120);

scene.add(new THREE.HemisphereLight(0xffe2b8,0x1a0a05,0.5));
const spot=new THREE.SpotLight(0xfff0d8,1.7,0,0.6,0.9,1);
spot.position.set(0,20,3);
spot.castShadow=true;
spot.shadow.mapSize.set(1024,1024);
spot.shadow.camera.near=6; spot.shadow.camera.far=40;
spot.shadow.bias=-0.0003;
spot.shadow.radius=4;
scene.add(spot); scene.add(spot.target);
const rimLight=new THREE.PointLight(0xffb060,0.55,70);
rimLight.position.set(-9,7,-8); scene.add(rimLight);
const rimLight2=new THREE.PointLight(0xff8a50,0.35,70);
rimLight2.position.set(9,6,8); scene.add(rimLight2);

/* ================= Textures ================= */
function makeFeltCanvas(){
  const c=document.createElement('canvas'); c.width=c.height=512;
  const g=c.getContext('2d');
  g.fillStyle='#12623f'; g.fillRect(0,0,512,512);
  const img=g.getImageData(0,0,512,512), d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-0.5)*38;
    d[i]+=n*0.5; d[i+1]+=n; d[i+2]+=n*0.6;
  }
  g.putImageData(img,0,0);
  g.lineWidth=1;
  for(let i=0;i<11000;i++){
    const x=Math.random()*512,y=Math.random()*512,a=Math.random()*6.283,l=2+Math.random()*6;
    g.strokeStyle=Math.random()<0.5?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.09)';
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke();
  }
  return c;
}
function makeLeatherCanvas(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#3a1511'; g.fillRect(0,0,256,256);
  const img=g.getImageData(0,0,256,256), d=img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*26; d[i]+=n; d[i+1]+=n*0.5; d[i+2]+=n*0.4; }
  g.putImageData(img,0,0);
  return c;
}
const maxAniso=renderer.capabilities.getMaxAnisotropy();
const feltCanvas=makeFeltCanvas();
const feltMap=new THREE.CanvasTexture(feltCanvas);
const feltBump=new THREE.CanvasTexture(feltCanvas);
[feltMap,feltBump].forEach(t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=maxAniso;});
feltMap.encoding=THREE.sRGBEncoding;
const leatherCanvas=makeLeatherCanvas();
const leatherMap=new THREE.CanvasTexture(leatherCanvas);
leatherMap.wrapS=leatherMap.wrapT=THREE.RepeatWrapping; leatherMap.encoding=THREE.sRGBEncoding;
leatherMap.repeat.set(6,1);

const feltMat=new THREE.MeshStandardMaterial({map:feltMap,bumpMap:feltBump,bumpScale:0.9,roughness:1,metalness:0});
const leatherMat=new THREE.MeshStandardMaterial({map:leatherMap,bumpMap:leatherMap,bumpScale:0.6,roughness:0.45,metalness:0.05});
const woodMat=new THREE.MeshStandardMaterial({color:0x1d0d07,roughness:0.5,metalness:0.1});
const goldMat=new THREE.MeshStandardMaterial({color:0xd7ad4f,roughness:0.28,metalness:0.55,emissive:0x2e2008});

/* ================= Physics ================= */
const world=new CANNON.World();
world.gravity.set(0,-GRAV,0);
world.allowSleep=true;
world.solver.iterations=14;
world.broadphase=new CANNON.NaiveBroadphase();
const mDice=new CANNON.Material('dice'),mFelt=new CANNON.Material('felt'),mWall=new CANNON.Material('wall');
world.addContactMaterial(new CANNON.ContactMaterial(mDice,mFelt,{friction:0.42,restitution:0.28}));
world.addContactMaterial(new CANNON.ContactMaterial(mDice,mDice,{friction:0.2,restitution:0.5}));
world.addContactMaterial(new CANNON.ContactMaterial(mDice,mWall,{friction:0.12,restitution:0.55}));

let hx=4.4,hz=6.4,isLand=false,tableGroup=null,staticBodies=[];
const root=new THREE.Group();   // 桌面與骰子放在這裡,隨手機水平儀傾斜
scene.add(root);

function planeBody(mat,rotFn,pos,isWall){
  const b=new CANNON.Body({mass:0,material:mat,shape:new CANNON.Plane()});
  rotFn(b.quaternion); b.position.set(pos[0],pos[1],pos[2]); b.isWall=isWall;
  world.addBody(b); staticBodies.push(b); return b;
}
function buildTable(){
  if(tableGroup){
    root.remove(tableGroup);
    tableGroup.traverse(o=>{if(o.geometry)o.geometry.dispose();});
  }
  staticBodies.forEach(b=>world.removeBody(b)); staticBodies=[];
  tableGroup=new THREE.Group();
  const W=hx*2,D=hz*2;

  feltMap.repeat.set(W/3,D/3); feltBump.repeat.copy(feltMap.repeat);
  const felt=new THREE.Mesh(new THREE.PlaneGeometry(W+0.4,D+0.4),feltMat);
  felt.rotation.x=-Math.PI/2; felt.receiveShadow=true; tableGroup.add(felt);

  const base=new THREE.Mesh(new THREE.BoxGeometry(W+3,1.2,D+3),woodMat);
  base.position.y=-0.62; tableGroup.add(base);

  const RH=1.3,RT=1.2;
  const mk=(w,h,d,x,y,z,m)=>{const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);me.position.set(x,y,z);me.castShadow=true;me.receiveShadow=true;tableGroup.add(me);return me;};
  mk(W+RT*2,RH,RT,0,RH/2,-(hz+RT/2),leatherMat);
  mk(W+RT*2,RH,RT,0,RH/2, (hz+RT/2),leatherMat);
  mk(RT,RH,D,-(hx+RT/2),RH/2,0,leatherMat);
  mk(RT,RH,D, (hx+RT/2),RH/2,0,leatherMat);
  // 金色鑲邊
  mk(W+0.1,0.09,0.12,0,0.04,-(hz-0.02),goldMat);
  mk(W+0.1,0.09,0.12,0,0.04, (hz-0.02),goldMat);
  mk(0.12,0.09,D+0.1,-(hx-0.02),0.04,0,goldMat);
  mk(0.12,0.09,D+0.1, (hx-0.02),0.04,0,goldMat);
  mk(W+RT*2+0.06,0.07,0.1,0,RH+0.02,-(hz+0.1),goldMat);
  mk(W+RT*2+0.06,0.07,0.1,0,RH+0.02, (hz+0.1),goldMat);
  mk(0.1,0.07,D,-(hx+0.1),RH+0.02,0,goldMat);
  mk(0.1,0.07,D, (hx+0.1),RH+0.02,0,goldMat);
  root.add(tableGroup);

  planeBody(mFelt,q=>q.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2),[0,0,0],false);
  planeBody(mWall,q=>q.setFromAxisAngle(new CANNON.Vec3(1,0,0), Math.PI/2),[0,14,0],true);
  planeBody(mWall,q=>q.setFromAxisAngle(new CANNON.Vec3(0,1,0), Math.PI/2),[-hx,0,0],true);
  planeBody(mWall,q=>q.setFromAxisAngle(new CANNON.Vec3(0,1,0),-Math.PI/2),[ hx,0,0],true);
  planeBody(mWall,q=>q.setFromAxisAngle(new CANNON.Vec3(0,1,0),0),[0,0,-hz],true);
  planeBody(mWall,q=>q.setFromAxisAngle(new CANNON.Vec3(0,1,0),Math.PI),[0,0, hz],true);

  spot.angle=Math.atan((Math.max(hx,hz)+2.5)/20);
}

/* ================= Dice ================= */
function roundedBoxGeo(s,r,seg){
  const g=new THREE.BoxGeometry(s,s,s,seg,seg,seg);
  const p=g.attributes.position,nm=g.attributes.normal;
  const inner=s/2-r,v=new THREE.Vector3(),c=new THREE.Vector3(),n=new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    c.set(clamp(v.x,-inner,inner),clamp(v.y,-inner,inner),clamp(v.z,-inner,inner));
    n.subVectors(v,c);
    if(n.lengthSq()>1e-8){
      n.normalize(); v.copy(c).addScaledVector(n,r);
      nm.setXYZ(i,n.x,n.y,n.z); p.setXYZ(i,v.x,v.y,v.z);
    }
  }
  return g;
}
const PIPS={1:[[.5,.5]],2:[[.27,.27],[.73,.73]],3:[[.27,.27],[.5,.5],[.73,.73]],
  4:[[.27,.27],[.73,.27],[.27,.73],[.73,.73]],5:[[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]],
  6:[[.27,.27],[.73,.27],[.27,.5],[.73,.5],[.27,.73],[.73,.73]]};
function faceTexture(n){
  const S=256,c=document.createElement('canvas'); c.width=c.height=S;
  const g=c.getContext('2d');
  const bg=g.createRadialGradient(S*.45,S*.4,10,S/2,S/2,S*.8);
  bg.addColorStop(0,'#c4202a'); bg.addColorStop(1,'#7a0c14');
  g.fillStyle=bg; g.fillRect(0,0,S,S);
  const img=g.getImageData(0,0,S,S),d=img.data;
  for(let i=0;i<d.length;i+=4){const k=(Math.random()-0.5)*8;d[i]+=k;d[i+1]+=k*0.3;d[i+2]+=k*0.3;}
  g.putImageData(img,0,0);
  PIPS[n].forEach(([x,y])=>{
    const r=n===1?34:23,px=x*S,py=y*S;
    g.fillStyle='rgba(40,0,4,.65)'; g.beginPath(); g.arc(px,py,r+3,0,6.283); g.fill();
    const pg=g.createRadialGradient(px-r*.3,py-r*.3,2,px,py,r);
    pg.addColorStop(0,'#ffffff'); pg.addColorStop(1,'#e2d3b3');
    g.fillStyle=pg; g.beginPath(); g.arc(px,py,r,0,6.283); g.fill();
  });
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=maxAniso; return t;
}
const FACE_VALUES=[3,4,1,6,2,5]; // +x -x +y -y +z -z
const diceGeo=roundedBoxGeo(SIZE,RADIUS,12);
const diceMats=FACE_VALUES.map(n=>new THREE.MeshPhysicalMaterial({map:faceTexture(n),roughness:0.3,metalness:0.05,clearcoat:1,clearcoatRoughness:0.12}));
const AX=[[1,0,0,3],[-1,0,0,4],[0,1,0,1],[0,-1,0,6],[0,0,1,2],[0,0,-1,5]];

const lastSnd={}; let lastVib=0;
function onCollide(e){
  const v=Math.abs(e.contact.getImpactVelocityAlongNormal());
  if(v<0.7) return;
  const now=performance.now();
  const kind=e.body.isDice?'die':(e.body.isWall?'wall':'felt');
  if(now-(lastSnd[kind]||0)<(kind==='die'?35:22)) return;
  lastSnd[kind]=now;
  sfxHit(kind,clamp(v/16,0.05,1));
  if(v>7&&navigator.vibrate&&now-lastVib>120){navigator.vibrate(8);lastVib=now;}
}
const dice=[];
for(let i=0;i<3;i++){
  const mesh=new THREE.Mesh(diceGeo,diceMats);
  mesh.castShadow=true; mesh.receiveShadow=true; mesh.visible=false; root.add(mesh);
  const body=new CANNON.Body({mass:1,material:mDice,shape:new CANNON.Box(new CANNON.Vec3(SIZE/2,SIZE/2,SIZE/2)),
    allowSleep:true,sleepSpeedLimit:0.35,sleepTimeLimit:0.45,linearDamping:0.08,angularDamping:0.08});
  body.isDice=true; body.addEventListener('collide',onCollide);
  dice.push({mesh,body,active:false});
}

/* ================= Game state ================= */
let count=1,rolling=false,settleT=0,fixTries=0,started=false;

function setCount(n){
  count=n;
  dice.forEach((d,i)=>{
    if(i<n){
      if(!d.active){world.addBody(d.body);d.active=true;}
      d.mesh.visible=true;
      const b=d.body; b.wakeUp();
      b.velocity.set(rand(-1,1),0,rand(-1,1));
      b.angularVelocity.set(rand(-6,6),rand(-6,6),rand(-6,6));
      b.position.set((i-(n-1)/2)*2.3+rand(-.3,.3),2.6+i*2.0,rand(-1.2,1.2));
      b.quaternion.setFromEuler(rand(0,6.28),rand(0,6.28),rand(0,6.28));
    }else if(d.active){world.removeBody(d.body);d.active=false;d.mesh.visible=false;}
  });
  startRolling();
}
function startRolling(){
  rolling=true;settleT=0;fixTries=0;
  $('faces').textContent='…';$('sum').textContent='擲骰中';$('tag').textContent='';
}
function readDie(d){
  const q=d.body.quaternion,tq=new THREE.Quaternion(q.x,q.y,q.z,q.w),v=new THREE.Vector3();
  let best=-2,val=1;
  for(const a of AX){v.set(a[0],a[1],a[2]).applyQuaternion(tq);if(v.y>best){best=v.y;val=a[3];}}
  return {val,up:best};
}
const GLYPH=['','⚀','⚁','⚂','⚃','⚄','⚅'];
function showResult(){
  const vals=dice.filter(d=>d.active).map(d=>readDie(d).val);
  const sum=vals.reduce((a,b)=>a+b,0);
  $('faces').textContent=vals.map(v=>GLYPH[v]).join(' ');
  $('sum').textContent='合計 '+sum;
  let tag='';
  if(vals.length===3){
    if(vals[0]===vals[1]&&vals[1]===vals[2]) tag='圍骰';
    else tag=sum>=11?'大':'小';
  }
  $('tag').textContent=tag;
}
function updateSettle(dt){
  if(!rolling){
    // 傾斜讓骰子又滑動時,重新結算
    if(dice.some(d=>d.active&&d.body.velocity.lengthSquared()>1.0))startRolling();
    return;
  }
  let still=true;
  dice.forEach(d=>{if(d.active&&(d.body.velocity.lengthSquared()>0.06||d.body.angularVelocity.lengthSquared()>0.16))still=false;});
  if(!still){settleT=0;return;}
  settleT+=dt; if(settleT<0.4) return;
  let bad=false;
  dice.forEach(d=>{
    if(!d.active) return;
    if(readDie(d).up<0.985){
      bad=true;
      if(fixTries<5){const b=d.body;b.wakeUp();b.velocity.set(rand(-1.5,1.5),4,rand(-1.5,1.5));b.angularVelocity.set(rand(-8,8),rand(-8,8),rand(-8,8));}
    }
  });
  if(bad&&fixTries<5){fixTries++;settleT=0;return;}
  rolling=false; showResult();
}

/* ================= 擲骰(單一初始力)/ 搖晃 / 水平儀傾斜 ================= */
// 擲骰只在出手瞬間給一次初速向量,之後不再施力。
// 力道範圍由物理模擬校準:最小力碰撞約 2~3 次,最大力約 4~5 次。
const V_MIN=18,V_MAX=42,VY=3,SPIN=0.4;   // 力量上下限為原本(9~21)的兩倍
function throwDice(dx,dz,s){
  const len=Math.hypot(dx,dz)||1; dx/=len; dz/=len;
  const sp=V_MIN+(V_MAX-V_MIN)*clamp(s,0,1);
  dice.forEach(d=>{
    if(!d.active) return;
    const b=d.body,j=rand(-0.14,0.14),c=Math.cos(j),sn=Math.sin(j);
    let ddx=dx*c-dz*sn,ddz=dx*sn+dz*c;
    // 靠牆時避免一出手就撞牆
    if(Math.abs(b.position.x)>hx-2.2&&b.position.x*ddx>0)ddx=-ddx;
    if(Math.abs(b.position.z)>hz-2.2&&b.position.z*ddz>0)ddz=-ddz;
    const k=sp*rand(0.93,1.07);
    b.wakeUp();
    b.velocity.set(ddx*k,VY,ddz*k);
    b.angularVelocity.set(ddz*k*SPIN+rand(-3,3),rand(-3,3),-ddx*k*SPIN+rand(-3,3));
  });
  startRolling();
}
// 按「擲骰」:骰子從玩家這一側(畫面下緣)被丟向桌子遠端
function rollRandom(){
  dice.forEach((d,i)=>{
    if(!d.active) return;
    const b=d.body;
    b.wakeUp();
    b.position.set((i-(count-1)/2)*2.1+rand(-.3,.3),2.2+i*1.7,hz-1.2);
    b.quaternion.setFromEuler(rand(0,6.28),rand(0,6.28),rand(0,6.28));
    b.velocity.set(0,0,0);b.angularVelocity.set(0,0,0);
  });
  const a=rand(-0.3,0.3);
  throwDice(Math.sin(a),-Math.cos(a),Math.random());
}

function screenAngle(){
  let ang=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
  return ((ang%360)+360)%360;
}

/* ---- 搖晃偵測:取一次搖晃的峰值方向與強度,只出手一次 ---- */
const SHAKE_TH=14;
let sensorOn=false,orientOn=false,lastShake=0,peak=null,peakStart=0;
const grav={x:0,y:0,z:0};
function onMotion(e){
  let ax,ay,az;
  const a=e.acceleration;
  if(a&&a.x!=null){ax=a.x;ay=a.y;az=a.z;}
  else{
    const g=e.accelerationIncludingGravity; if(!g||g.x==null) return;
    grav.x=grav.x*0.85+g.x*0.15;grav.y=grav.y*0.85+g.y*0.15;grav.z=grav.z*0.85+g.z*0.15;
    ax=g.x-grav.x;ay=g.y-grav.y;az=g.z-grav.z;
  }
  const ang=screenAngle();
  let sx=ax,sy=ay;
  if(ang===90){sx=-ay;sy=ax;}else if(ang===180){sx=-ax;sy=-ay;}else if(ang===270){sx=ay;sy=-ax;}
  sensorOn=true;
  const mag=Math.hypot(sx,sy,az),now=performance.now();
  if(mag>SHAKE_TH&&now-lastShake>900){
    if(!peak){peak={x:sx,y:sy,m:mag};peakStart=now;}
    else if(mag>peak.m){peak.x=sx;peak.y=sy;peak.m=mag;}
  }
}
function checkShake(now){
  if(!peak||now-peakStart<110) return;
  const p=peak;peak=null;lastShake=now;
  if(!started) return;
  const s=clamp((p.m-SHAKE_TH)/(40-SHAKE_TH),0,1);
  throwDice(-p.x,p.y,s);      // 骰子因慣性往手機加速的反方向衝出
}

/* ---- 水平儀:桌面與重力隨手機傾斜 ---- */
const tilt={x:0,z:0},tiltTarget={x:0,z:0},appliedG={x:0,z:0};
let base=null,calibrate=true;
function onOrient(e){
  if(e.beta==null||e.gamma==null) return;
  orientOn=true;
  if(!base||calibrate){base={b:e.beta,g:e.gamma};calibrate=false;}
  let db=e.beta-base.b,dg=e.gamma-base.g;
  if(db>180)db-=360;if(db<-180)db+=360;
  const ang=screenAngle();
  let tx,tz;
  if(ang===90){tx=-db;tz=-dg;}else if(ang===180){tx=-dg;tz=-db;}else if(ang===270){tx=db;tz=dg;}else{tx=dg;tz=db;}
  tiltTarget.x=clamp(tx,-30,30);tiltTarget.z=clamp(tz,-30,30);
}
function applyTilt(dt){
  const k=Math.min(1,dt*10),dzone=v=>Math.sign(v)*Math.max(0,Math.abs(v)-2);
  tilt.x+=(dzone(tiltTarget.x)-tilt.x)*k;
  tilt.z+=(dzone(tiltTarget.z)-tilt.z)*k;
  const tx=tilt.x*Math.PI/180,tz=tilt.z*Math.PI/180;
  root.rotation.z=-tx*0.7;root.rotation.x=tz*0.7;      // 視覺傾斜
  const gx=Math.sin(tx),gz=Math.sin(tz),gy=-Math.sqrt(Math.max(0.05,1-gx*gx-gz*gz));
  if(Math.abs(gx-appliedG.x)>0.006||Math.abs(gz-appliedG.z)>0.006){
    appliedG.x=gx;appliedG.z=gz;
    world.gravity.set(gx*GRAV,gy*GRAV,gz*GRAV);         // 物理傾斜:骰子往低處滑
    dice.forEach(d=>{if(d.active)d.body.wakeUp();});
  }
}

async function enableSensors(){
  try{
    const P=(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')?DeviceMotionEvent
      :((typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')?DeviceOrientationEvent:null);
    if(P){
      const r=await P.requestPermission();
      if(r!=='granted'){setStatus('未取得動作感應權限,可點「擲骰」按鈕');return;}
    }
    window.addEventListener('devicemotion',onMotion);
    window.addEventListener('deviceorientation',onOrient);
    setStatus('📳 搖晃擲骰 · 傾斜手機桌面會跟著傾斜');
    setTimeout(()=>{if(!sensorOn&&!orientOn)setStatus('未偵測到感應器(桌機屬正常),請點「擲骰」或按空白鍵');},2200);
  }catch(err){setStatus('感應器無法啟用,請點「擲骰」按鈕');}
}
function setStatus(t){$('status').textContent=t;}

/* ================= Audio ================= */
let AC=null,master,musicGain,sfxGain,noiseBuf,musicOn=true,nextT=0,stepIdx=0,schedTimer=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
  AC=new Ctx();
  const comp=AC.createDynamicsCompressor();
  master=AC.createGain();master.gain.value=0.9;master.connect(comp);comp.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.5;
  sfxGain=AC.createGain();sfxGain.gain.value=1;
  const rev=AC.createConvolver(),rg=AC.createGain();rg.gain.value=0.28;
  const len=Math.floor(AC.sampleRate*1.8),ib=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ib.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}
  rev.buffer=ib;
  musicGain.connect(master);musicGain.connect(rev);rev.connect(rg);rg.connect(master);
  sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  nextT=AC.currentTime+0.15;stepIdx=0;
  schedTimer=setInterval(scheduler,30);
}
function noiseSrc(t,dur){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;s.start(t,Math.random()*0.8);s.stop(t+dur);return s;}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}

function sfxHit(kind,s){
  if(!AC||AC.state!=='running') return;
  const t=AC.currentTime;
  if(kind==='felt'){
    const n=noiseSrc(t,0.15),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass';f.frequency.value=380+s*300;env(g,t,0.004,0.35*s+0.02,0.09);
    n.connect(f);f.connect(g);g.connect(sfxGain);
    const o=AC.createOscillator(),og=AC.createGain();
    o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(55,t+0.08);
    env(og,t,0.003,0.3*s+0.02,0.09);o.connect(og);og.connect(sfxGain);o.start(t);o.stop(t+0.15);
    return;
  }
  const n=noiseSrc(t,0.1),bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass';bp.frequency.value=2200+Math.random()*1800;bp.Q.value=1.1;
  env(g,t,0.001,0.55*s+0.03,0.045);n.connect(bp);bp.connect(g);g.connect(sfxGain);
  const o=AC.createOscillator(),og=AC.createGain();
  o.type='triangle';o.frequency.value=(kind==='die'?1500:900)+Math.random()*500;
  env(og,t,0.002,0.18*s+0.01,0.05);o.connect(og);og.connect(sfxGain);o.start(t);o.stop(t+0.1);
  const o2=AC.createOscillator(),g2=AC.createGain();
  o2.type='sine';o2.frequency.setValueAtTime(kind==='wall'?190:420,t);
  o2.frequency.exponentialRampToValueAtTime(kind==='wall'?90:260,t+0.07);
  env(g2,t,0.002,(kind==='wall'?0.3:0.14)*s+0.01,0.08);o2.connect(g2);g2.connect(sfxGain);o2.start(t);o2.stop(t+0.15);
}

/* ---- 爵士賭場音樂 ---- */
const BPM=104,STEP=60/BPM/3;
const CH={
  Dm:{pv:[53,57,60,64],bass:[38,41,45,42],sc:[62,65,69,72,74,76]},
  G:{pv:[53,59,64,69],bass:[43,47,50,47],sc:[67,71,74,76,79]},
  C:{pv:[52,55,59,62],bass:[48,52,55,46],sc:[64,67,71,72,76,79]},
  Am:{pv:[55,60,64,67],bass:[45,43,41,39],sc:[64,67,69,72,76]},
  A7:{pv:[55,61,64,66],bass:[45,49,52,39],sc:[61,64,67,69,73]}
};
const PROG=['Dm','G','C','Am','Dm','G','C','A7'];
function mOut(){return musicGain;}
function rhodes(m,t,dur,vol){
  const f=mtof(m),g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=3200;
  env(g,t,0.004,vol,dur);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),g2=AC.createGain();
  o1.type='sine';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=0.25;
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(lp);lp.connect(mOut());
  o1.start(t);o2.start(t);o1.stop(t+dur+0.1);o2.stop(t+dur+0.1);
}
function bassNote(m,t){
  const f=mtof(m),g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=520;env(g,t,0.012,0.42,0.42);
  const o1=AC.createOscillator(),o2=AC.createOscillator();
  o1.type='triangle';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f;
  o1.connect(g);o2.connect(g);g.connect(lp);lp.connect(mOut());
  o1.start(t);o2.start(t);o1.stop(t+0.6);o2.stop(t+0.6);
}
function vibe(m,t){
  const f=mtof(m),g=AC.createGain();
  env(g,t,0.004,0.085,0.9);
  const o1=AC.createOscillator(),o2=AC.createOscillator(),g2=AC.createGain();
  o1.type='sine';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f*4;g2.gain.value=0.12;
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(mOut());
  o1.start(t);o2.start(t);o1.stop(t+1);o2.stop(t+1);
}
function ride(t,vol){
  const n=noiseSrc(t,0.3),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type='highpass';hp.frequency.value=6500;env(g,t,0.002,vol,0.14);
  n.connect(hp);hp.connect(g);g.connect(mOut());
}
function hat(t){
  const n=noiseSrc(t,0.1),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type='highpass';hp.frequency.value=9000;env(g,t,0.001,0.07,0.04);
  n.connect(hp);hp.connect(g);g.connect(mOut());
}
function kick(t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);
  env(g,t,0.003,0.16,0.14);o.connect(g);g.connect(mOut());o.start(t);o.stop(t+0.25);
}
function playStep(i,t){
  const bar=Math.floor(i/12),beat=Math.floor((i%12)/3),sub=i%3,ch=CH[PROG[bar]];
  if(sub===0){
    bassNote(ch.bass[beat],t);
    ride(t,beat%2===0?0.055:0.04);
    if(beat===0||beat===2)kick(t);else hat(t);
  }
  if(sub===2&&(beat===1||beat===3))ride(t,0.035);
  if(beat===0&&sub===0)ch.pv.forEach(m=>rhodes(m,t,1.3,0.06));
  else if(beat===1&&sub===2&&Math.random()<0.8)ch.pv.forEach(m=>rhodes(m,t,0.35,0.05));
  else if(beat===3&&sub===2&&Math.random()<0.5)ch.pv.forEach(m=>rhodes(m,t,0.35,0.05));
  if(sub!==1&&Math.random()<0.22)vibe(ch.sc[Math.floor(Math.random()*ch.sc.length)],t);
}
function scheduler(){
  if(!AC||AC.state!=='running')return;
  while(nextT<AC.currentTime+0.15){playStep(stepIdx,nextT);nextT+=STEP;stepIdx=(stepIdx+1)%96;}
}
document.addEventListener('visibilitychange',()=>{
  if(!AC)return;
  if(document.hidden)AC.suspend();else{AC.resume();nextT=AC.currentTime+0.1;}
});

/* ================= Camera fit / resize ================= */
function fitCamera(){
  const pitch=THREE.MathUtils.degToRad(isLand?58:66);
  const dirv=new THREE.Vector3(0,Math.sin(pitch),Math.cos(pitch));
  const target=new THREE.Vector3(0,0,0);
  const cs=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>new THREE.Vector3(a*(hx+1.3),1.3,b*(hz+1.3)));
  const ylim=isLand?0.8:0.7;
  for(let dist=8;dist<90;dist+=0.4){
    camera.position.copy(dirv).multiplyScalar(dist).add(target);
    camera.lookAt(target);camera.updateMatrixWorld();
    let ok=true;
    for(const c of cs){const p=c.clone().project(camera);if(Math.abs(p.x)>0.97||Math.abs(p.y)>ylim){ok=false;break;}}
    if(ok)break;
  }
}
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  const land=w/h>1.1;
  const changed=!tableGroup||land!==isLand;
  isLand=land;
  if(changed){
    if(land){hz=4.4;hx=clamp(hz*(w/h)*0.7,6.5,8.5);}else{hx=4.4;hz=6.4;}
    buildTable();
    if(started)setCount(count);
  }
  fitCamera();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>{calibrate=true;setTimeout(resize,250);});

/* ================= Main loop ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(started){
    checkShake(performance.now());
    applyTilt(dt);
    world.step(1/120,dt,10);
    dice.forEach(d=>{
      if(!d.active)return;
      const p=d.body.position;
      if(p.y<-3||Math.abs(p.x)>hx+1||Math.abs(p.z)>hz+1){p.set(0,3,0);d.body.velocity.set(0,0,0);d.body.wakeUp();}
      d.mesh.position.copy(d.body.position);d.mesh.quaternion.copy(d.body.quaternion);
    });
    updateSettle(dt);
  }
  renderer.render(scene,camera);
}

/* ================= UI ================= */
document.querySelectorAll('.cnt').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.cnt').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    setCount(parseInt(btn.dataset.n,10));
  });
});
$('roll').addEventListener('click',()=>{if(started)rollRandom();});
$('calib').addEventListener('click',()=>{calibrate=true;setStatus('已校準:目前握持角度視為水平');});
$('music').addEventListener('click',()=>{
  musicOn=!musicOn;$('music').classList.toggle('off',!musicOn);
  $('music').textContent=musicOn?'♪ 音樂':'♪ 靜音';
  if(musicGain)musicGain.gain.setTargetAtTime(musicOn?0.5:0,AC.currentTime,0.1);
});
renderer.domElement.addEventListener('pointerdown',()=>{if(started&&!rolling)rollRandom();});
window.addEventListener('keydown',e=>{
  if(!started)return;
  if(e.code==='Space'){e.preventDefault();rollRandom();}
  else if(e.key==='1'||e.key==='2'||e.key==='3'){
    const b=document.querySelector('.cnt[data-n="'+e.key+'"]');if(b)b.click();
  }
});
$('enter').addEventListener('click',()=>{
  enableSensors();                       // 需在使用者手勢內呼叫(iOS)
  try{initAudio();if(AC&&AC.state==='suspended')AC.resume();}catch(err){}
  $('start').style.display='none';
  started=true;
  setCount(count);
});

resize();
requestAnimationFrame(frame);
})();
</script>
